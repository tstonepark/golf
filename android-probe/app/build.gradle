plugins { id 'com.android.application' }
// 테스트용 고정 서명 키(공개 저장소에 있음). 빌드마다 같은 키로 서명해야 폰에서 덮어쓰기 설치가 됨
def runNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()
android {
  namespace 'kr.adn.fpsprobe'
  compileSdk 34
  defaultConfig { applicationId 'kr.adn.fpsprobe'; minSdk 31; targetSdk 34; versionCode 100 + runNo; versionName "1.2." + runNo }
  signingConfigs {
    fixed { storeFile file('../signing/probe.jks'); storePassword 'golfprobe'; keyAlias 'probe'; keyPassword 'golfprobe' }
  }
  buildTypes { debug { signingConfig signingConfigs.fixed } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

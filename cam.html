<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>스윙 코치 카메라</title>
<style>
/* 폰 = 카메라 전용. 화면에는 연결 코드와 수평계만 크게 */
:root{
  color-scheme:dark;
  --bg:#0c1512; --panel:#13201b; --line:#294238; --ink:#eaf2ec; --dim:#8fa69a;
  --axis:#ffd23f; --ok:#58d68d; --warn:#ff8a5b;
  --num:"Barlow Condensed","Roboto Condensed",system-ui,sans-serif;
  --txt:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.45 var(--txt);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
[hidden]{display:none!important}
#top{padding:16px 16px 8px;display:flex;flex-direction:column;gap:6px}
#top h1{margin:0;font-size:20px;color:var(--dim);font-weight:600}
#code{font:700 64px/1 var(--num);letter-spacing:.08em;color:var(--axis);font-variant-numeric:tabular-nums}
#state{font-size:20px;font-weight:700}
#state.ok{color:var(--ok)} #state.bad{color:var(--warn)}
#level{font:600 22px var(--num);color:var(--dim);font-variant-numeric:tabular-nums}
#level.bad{color:var(--warn)} #level.ok{color:var(--ok)}
#stage{position:relative;flex:1;min-height:0;background:#000}
#v{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#guide{position:absolute;inset:0;pointer-events:none}
#bar{display:flex;gap:10px;padding:12px 16px;background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap}
button{font:700 18px var(--txt);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;
  padding:14px 12px;min-height:56px;flex:1 1 30%;cursor:pointer}
button.main{background:var(--axis);border-color:var(--axis);color:#1a1400;flex:1 1 100%}
button:focus-visible{outline:3px solid var(--axis);outline-offset:2px}
#err{color:var(--warn);font-size:16px;padding:0 16px}
</style>
</head>
<body>
<div id="top">
  <h1>스윙 코치 카메라 · 아이패드에 아래 번호를 입력하세요</h1>
  <div id="code">------</div>
  <div id="state">준비 중</div>
  <div id="level"></div>
  <div id="net" style="font-size:16px;color:var(--dim)"></div>
</div>
<div id="stage">
  <video id="v" playsinline muted autoplay></video>
  <canvas id="guide"></canvas>
</div>
<p id="err"></p>
<p id="diag" style="font-size:14px;color:var(--dim);padding:0 16px;margin:0;white-space:pre-line;word-break:break-all"></p>
<div id="bar">
  <button class="main" id="start">카메라 켜기</button>
  <button id="lens" disabled>렌즈 바꾸기</button>
  <button id="newcode">번호 바꾸기</button>
</div>
<script src="vendor/peerjs/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const PFX="adn-golfcoach-";
// 중개 서버: 기본은 PeerJS 공개 서버. 주소 뒤에 ?peer=호스트:포트 를 붙이면 그 서버를 씀(자체 서버·시험용)
// 영상 경로를 찾는 데 쓰는 서버: 공개 STUN 여러 곳 + PeerJS 기본 중계(TURN)
const ICE={iceServers:[{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]},{urls:"stun:stun.cloudflare.com:3478"},
  {urls:["turn:eu-0.turn.peerjs.com:3478","turn:us-0.turn.peerjs.com:3478"],username:"peerjs",credential:"peerjsp"}]};
function peerOpts(){ const o={config:ICE}; const v=new URLSearchParams(location.search).get("peer"); if(!v) return o;
  const m=v.match(/^([A-Za-z0-9.-]+):(\d{1,5})$/); if(!m) return o;
  return Object.assign(o,{host:m[1],port:+m[2],path:"/",secure:location.protocol==="https:"}); }
// 연결 진단: 이 기기가 낸 경로 후보 종류(host=같은 와이파이 직접, srflx=공유기 바깥 주소, relay=중계)
// 경로 진단 덤프: 양쪽이 낸 주소 후보와, 주소 쌍마다 확인이 어디까지 갔는지
async function iceDump(pc){
  if(!pc||!pc.getStats) return "";
  try{
    const st=await pc.getStats(), L=[], R=[]; let tried=0, ok=0, fail=0;
    st.forEach(r=>{
      if(r.type==="local-candidate") L.push(r.candidateType+" "+(r.address||r.ip||"?")+(r.networkType?"("+r.networkType+")":""));
      else if(r.type==="remote-candidate") R.push(r.candidateType+" "+(r.address||r.ip||"?"));
      else if(r.type==="candidate-pair"){ tried++; if(r.state==="succeeded") ok++; if(r.state==="failed") fail++; }
    });
    const u=a=>[...new Set(a)].join(", ")||"없음";
    return "내 주소: "+u(L)+" / 상대 주소: "+u(R)+" / 주소 쌍 "+tried+"개 중 성공 "+ok+", 실패 "+fail;
  }catch(e){ return ""; }
}
function watchIce(pc,tag,log){
  if(!pc||pc._watched) return; pc._watched=true; const seen=new Set();
  pc.addEventListener("icecandidate",e=>{ if(e.candidate&&e.candidate.type&&!seen.has(e.candidate.type)){ seen.add(e.candidate.type); log(tag+" 후보: "+[...seen].join(",")); } });
  pc.addEventListener("iceconnectionstatechange",()=>{ const s=pc.iceConnectionState; log(tag+" 경로: "+s);
    if(s==="failed"||s==="disconnected") iceDump(pc).then(d=>{ if(d) log(tag+" "+d); }); });
  setTimeout(()=>{ if(pc.iceConnectionState==="checking"||pc.iceConnectionState==="new") iceDump(pc).then(d=>{ if(d) log(tag+" 12초째 확인 중 · "+d); }); },12000);
}                 // 공개 중개 서버에서 다른 서비스와 겹치지 않게 붙이는 접두어
const FPS=Number(new URLSearchParams(location.search).get("fps"))||30;
let stream=null, peer=null, conn=null, call=null, cams=[], camIdx=-1, code=null, wake=null;
const tilt={pitch:null,roll:null};

function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function save(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function state(t,cls){ $("state").textContent=t; $("state").className=cls||""; }
const nl=[]; function netlog(m){ nl.push(m); if(nl.length>3) nl.shift(); $("diag").textContent=nl.join("\n"); }
function newCode(){ return String(Math.floor(100000+Math.random()*900000)); }   // 6자리: 남이 맞혀 들어오기 어렵게

// ---------- 카메라 ----------
async function openCam(deviceId){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  const v={width:{ideal:1280},height:{ideal:720},frameRate:{ideal:FPS}};
  if(deviceId){ v.deviceId={exact:deviceId}; stream=await navigator.mediaDevices.getUserMedia({audio:false,video:v}); }
  else{
    try{ stream=await navigator.mediaDevices.getUserMedia({audio:false,video:Object.assign({facingMode:{exact:"environment"}},v)}); }
    catch(e){ if(e.name==="NotAllowedError") throw e; stream=await navigator.mediaDevices.getUserMedia({audio:false,video:Object.assign({facingMode:"environment"},v)}); }
  }
  try{ cams=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==="videoinput"); }catch(e){ cams=[]; }
  // 처음 열 때: 후면 카메라 중 번호가 가장 작은 것(보통 기본 광각)을 고름. 갤럭시는 'camera2 0, facing back' 같은 이름
  if(!deviceId){
    const backs=backCams(); const cur=stream.getVideoTracks()[0].getSettings().deviceId;
    if(backs.length&&backs[0].deviceId!==cur){ stream.getTracks().forEach(t=>t.stop());
      stream=await navigator.mediaDevices.getUserMedia({audio:false,video:Object.assign({deviceId:{exact:backs[0].deviceId}},v)}); }
  }
  const tr=stream.getVideoTracks()[0]; try{ tr.contentHint="motion"; }catch(e){}
  $("v").srcObject=stream; $("v").play().catch(()=>{});
  setTimeout(()=>checkBlack(tr),1800);
  const set=tr.getSettings?tr.getSettings():{};
  camIdx=cams.findIndex(c=>c.deviceId===set.deviceId);
  $("lens").disabled=cams.length<2;
  $("lens").textContent= tr.label ? "렌즈: "+tr.label.replace(/camera/i,"").trim().slice(0,12) : "렌즈 바꾸기";
  // 이미 연결 중이면 보내는 영상만 바꿔 끼움 (연결은 유지)
  if(call&&call.peerConnection){
    const s=call.peerConnection.getSenders().find(x=>x.track&&x.track.kind==="video");
    if(s) try{ await s.replaceTrack(tr); }catch(e){}
  }
  sendInfo();
}
function backCams(){
  const num=c=>{ const m=(c.label||"").match(/(\d+)/); return m?+m[1]:99; };
  return cams.filter(c=>/back|rear|environment|후면/i.test(c.label||"")).sort((a,b)=>num(a)-num(b));
}
// 화면이 계속 검으면 그 렌즈는 못 쓰는 것 → 다음 후면 렌즈로 (최대 한 바퀴)
let blackTries=0;
function checkBlack(tr){
  const v=$("v"); if(!stream||stream.getVideoTracks()[0]!==tr||!v.videoWidth) return;
  const c=document.createElement("canvas"); c.width=32; c.height=32; const g=c.getContext("2d"); g.drawImage(v,0,0,32,32);
  const d=g.getImageData(0,0,32,32).data; let sum=0; for(let i=0;i<d.length;i+=4) sum+=d[i]+d[i+1]+d[i+2];
  const mean=sum/(32*32*3);
  if(mean<6&&blackTries<cams.length){ blackTries++; $("err").textContent="이 렌즈는 화면이 나오지 않아 다른 렌즈로 바꿉니다"; nextLens(); }
  else if(mean>=6){ blackTries=0; $("err").textContent=""; }
}
async function nextLens(){
  if(cams.length<2) return;
  const backs=backCams(), list=backs.length>1?backs:cams;   // 후면 렌즈끼리만 순환
  const cur=stream&&stream.getVideoTracks()[0].getSettings().deviceId;
  camIdx=(list.findIndex(c=>c.deviceId===cur)+1)%list.length;
  const target=list[camIdx];
  try{ await openCam(target.deviceId); }catch(e){ $("err").textContent="렌즈를 바꾸지 못했습니다 ("+e.name+")"; }
  return;
}

// ---------- 수평계 (아이패드로도 보냄: 기울기 보정용) ----------
window.addEventListener("deviceorientation",e=>{
  if(e.beta==null) return;
  const portrait=!(screen.orientation&&/landscape/.test(screen.orientation.type));
  if(portrait){ tilt.pitch=e.beta-90; tilt.roll=e.gamma; } else { tilt.pitch=Math.abs(e.gamma)-90; tilt.roll=e.beta; }
  const bad=Math.abs(tilt.pitch)>10||Math.abs(tilt.roll)>3;
  $("level").className=bad?"bad":"ok";
  $("level").textContent=(tilt.pitch>0?"위로 ":"아래로 ")+Math.abs(Math.round(tilt.pitch))+"° · 좌우 "+Math.round(Math.abs(tilt.roll))+"° "+(bad?"기울어짐":"수평");
});
// 0.1초마다 기울기, 기울기 센서가 없어도 1초마다 생존 신호 (아이패드가 끊김을 빨리 알아채도록)
let hbT=0;
setInterval(()=>{ if(!(conn&&conn.open)) return; const now=Date.now();
  try{ if(tilt.pitch!=null) conn.send({t:"tilt",pitch:tilt.pitch,roll:tilt.roll}); else if(now-hbT>1000){ hbT=now; conn.send({t:"hb"}); } }catch(e){} },100);
function sendInfo(){
  if(!(conn&&conn.open&&stream)) return;
  const tr=stream.getVideoTracks()[0], s=tr.getSettings?tr.getSettings():{};
  try{ conn.send({t:"info",label:tr.label||"",w:s.width,h:s.height,fps:s.frameRate}); }catch(e){}
}

// ---------- 연결 (공개 중개 서버로 처음에 서로 찾기만 하고, 영상은 와이파이 안에서 직접 보냄) ----------
function startPeer(){
  if(peer&&!peer.destroyed) peer.destroy();
  // 중개 서버에 등록이 끝나야 아이패드가 찾을 수 있으므로, 그 전에는 번호를 보여 주지 않음
  $("code").textContent="······"; state("중개 서버에 등록 중…");
  peer=new Peer(PFX+code,peerOpts());
  peer.on("open",()=>{ $("code").textContent=code; state("아이패드 연결 기다리는 중 · 위 번호를 아이패드에 입력하세요","ok"); });
  peer.on("error",e=>{
    if(e.type==="unavailable-id"){ code=newCode(); save("golfcam.code",code); startPeer(); return; }   // 번호가 이미 쓰이는 중
    if(e.type==="network"||e.type==="server-error"||e.type==="socket-error"||e.type==="socket-closed"){ state("중개 서버(0.peerjs.com)에 연결하지 못했습니다. 인터넷을 확인해 주세요","bad"); return; }
    state("연결 오류 ("+e.type+")","bad");
  });
  peer.on("disconnected",()=>{ if(!(conn&&conn.open)) state("중개 서버 연결 끊김 · 다시 등록 중…","bad");
    setTimeout(()=>{ try{ if(!peer.destroyed&&peer.disconnected) peer.reconnect(); }catch(e){} },2000); });
  peer.on("connection",c=>{
    // 새 연결이 오면 그쪽으로 바꿈 (아이패드가 다시 붙는 경우). 번호를 아는 기기만 들어올 수 있음
    state("아이패드가 접속함 · 경로 찾는 중"); watchIce(c.peerConnection,"데이터",netlog);
    c.on("open",()=>{
      if(conn&&conn!==c){ try{ conn.close(); }catch(e){} }
      if(call){ try{ call.close(); }catch(e){} call=null; }
      conn=c;
      watchIce(c.peerConnection,"데이터",netlog);
      call=peer.call(c.peer,stream);
      watchIce(call.peerConnection,"영상",netlog);
      const pc=call.peerConnection;
      if(pc) pc.addEventListener("iceconnectionstatechange",()=>{ const st=pc.iceConnectionState;
        if(st==="connected"||st==="completed") state("아이패드에 연결됨","ok");
        else if(st==="checking") state("아이패드 접속 · 영상 경로 찾는 중");
        else if(st==="failed") state("영상 경로가 막혔습니다. 두 기기를 같은 와이파이(또는 폰 핫스팟)에 연결하세요","bad"); });
      call.on("close",()=>{ if(conn===c) state("연결 끊김 · 아이패드가 다시 붙기를 기다리는 중","bad"); });
      tuneSender();
      sendInfo();
    });
    c.on("data",d=>{ if(d&&d.t==="lens") nextLens(); });
    c.on("close",()=>{ if(conn===c){ conn=null; state("연결 끊김 · 아이패드가 다시 붙기를 기다리는 중","bad"); } });
  });
}
// 화질보다 프레임 수를 지키도록 (스윙 분석은 끊기지 않는 게 중요)
function tuneSender(){
  setTimeout(()=>{ try{
    const s=call&&call.peerConnection&&call.peerConnection.getSenders().find(x=>x.track&&x.track.kind==="video");
    if(!s) return; const p=s.getParameters(); if(!p.encodings||!p.encodings.length) p.encodings=[{}];
    p.encodings[0].maxBitrate=4000000; p.encodings[0].maxFramerate=FPS; p.degradationPreference="maintain-framerate";
    s.setParameters(p).catch(()=>{});
  }catch(e){} },1500);
}

async function start(){
  $("err").textContent="";
  if(location.protocol!=="https:"&&!["localhost","127.0.0.1"].includes(location.hostname)){ $("err").textContent="https:// 주소로 열어야 카메라를 쓸 수 있습니다."; return; }
  if(typeof Peer==="undefined"){ $("err").textContent="연결 모듈을 불러오지 못했습니다. 새로고침해 주세요."; return; }
  $("start").disabled=true;
  try{ await openCam(); }
  catch(e){ $("start").disabled=false; $("err").textContent= e.name==="NotAllowedError" ? "카메라 권한이 거부되었습니다. 주소창 왼쪽 아이콘에서 카메라를 허용해 주세요." : "카메라를 열지 못했습니다 ("+e.name+")."; return; }
  $("start").hidden=true;
  try{ if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function") await DeviceOrientationEvent.requestPermission(); }catch(e){}
  try{ wake=await navigator.wakeLock.request("screen"); }catch(e){}
  startPeer();
}
// 화면이 꺼졌다 켜지면 중개 서버 연결이 끊겨 있을 수 있음 → 다시 등록
document.addEventListener("visibilitychange",async()=>{
  if(document.visibilityState!=="visible"||!stream) return;
  try{ wake=await navigator.wakeLock.request("screen"); }catch(e){}
  if(!peer||peer.destroyed) startPeer(); else if(peer.disconnected){ state("중개 서버에 다시 등록 중…"); try{ peer.reconnect(); }catch(e){ startPeer(); } }
});

// 화면 가운데 세로선: 골퍼를 화면 중앙에 맞추는 기준
function drawGuide(){
  const c=$("guide"), r=c.getBoundingClientRect(); c.width=r.width; c.height=r.height;
  const g=c.getContext("2d"); g.strokeStyle="rgba(255,210,63,.5)"; g.setLineDash([8,8]); g.lineWidth=2;
  g.beginPath(); g.moveTo(r.width/2,0); g.lineTo(r.width/2,r.height); g.stroke();
}
window.addEventListener("resize",drawGuide); drawGuide();

// 폰이 모바일 데이터면 아이패드와 직접 연결이 안 되는 경우가 많음 → 미리 알림
try{ const cn=navigator.connection; const chk=()=>{ const t=cn&&cn.type;
  $("net").textContent= t==="cellular" ? "⚠ 폰이 모바일 데이터입니다. 아이패드와 같은 와이파이에 연결하세요" : t==="wifi" ? "와이파이 연결됨" : ""; };
  if(cn){ chk(); cn.addEventListener("change",chk); } }catch(e){}
// 안드로이드 크롬에서는 아이패드와 직접 연결이 안 되는 사례 확인 → 삼성 인터넷 권장
try{ const ua=navigator.userAgent;
  if(/Android/i.test(ua)&&/Chrome\//.test(ua)&&!/SamsungBrowser/i.test(ua))
    $("net").innerHTML='<b style="color:var(--warn)">⚠ 크롬에서는 아이패드와 연결이 안 될 수 있습니다. <u>삼성 인터넷</u>으로 이 주소를 여세요.</b>';
}catch(e){}
code=load("golfcam.code"); if(!/^\d{6}$/.test(code||"")){ code=newCode(); save("golfcam.code",code); }
state("① 아래 '카메라 켜기'를 누르세요");
$("start").onclick=start;
// 카메라 권한을 이미 허용했으면 바로 시작
try{ navigator.permissions.query({name:"camera"}).then(r=>{ if(r.state==="granted") start(); }).catch(()=>{}); }catch(e){}
$("lens").onclick=nextLens;
$("newcode").onclick=()=>{ code=newCode(); save("golfcam.code",code); if(stream) startPeer(); };
</script>
</body>
</html>

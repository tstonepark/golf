name: fps-probe APK
on:
  push:
    paths: ["android-probe/**", ".github/workflows/fps-probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build debug APK
        working-directory: android-probe
        run: gradle --no-daemon assembleDebug
      - name: Rename + version
        run: |
          cp android-probe/app/build/outputs/apk/debug/app-debug.apk fps-probe.apk
          echo $((100 + GITHUB_RUN_NUMBER)) > version.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: fps-probe
          name: FPS 측정 앱
          body: "스윙 카메라 FPS 측정 앱 (테스트용, 디버그 서명). fps-probe.apk 를 폰에서 받아 설치."
          files: |
            fps-probe.apk
            version.txt
          make_latest: true

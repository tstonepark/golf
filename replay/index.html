<style>

.tw{overflow-x:auto}table{border-collapse:collapse;font-size:18px;width:100%}th,td{padding:6px 8px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}td:first-child,th:first-child{text-align:left}

</style></head><body>

</div>
<input type="file" id="file" accept="video/*">
<script src="../vendor/ort/ort.webgpu.min.js"></script>
<script src="../vendor/mp4box/mp4box.all.min.js"></script>
<script type="module">
import {W,H,setFrame,loadHead,headInfer,demux,decodeRange} from "./engine.js";
import * as A from "./analysis.js";
import {diagnose,summary} from "./diagnose.js";
const $=id=>document.getElementById(id);
let R=null, showLines=true, vfps=240;

// ---------- pose (MediaPipe tasks, same files as the live page) ----------
let lmk=null;
async function loadPose(){
  const MPV=await import("../vendor/tasks/vision_bundle.mjs");
  const vision=await MPV.FilesetResolver.forVisionTasks(new URL("../vendor/tasks/wasm",location.href).href);
  const fp=new URLSearchParams(location.search).get("pd");
  for(const delegate of (fp?[fp]:["GPU","CPU"])){
    try{ lmk=await MPV.PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:new URL("../vendor/models/pose_landmarker_heavy.task",location.href).href,delegate},runningMode:"VIDEO",numPoses:1}); return delegate; }
    catch(e){ console.warn("pose",delegate,e); }
  }
  throw new Error("뼈대 모델을 불러오지 못했습니다");
}
function poseOf(r){
  if(!r||!r.landmarks||!r.landmarks.length) return null;
  const L=r.landmarks[0], g=k=>[L[k].x*W,L[k].y*H];
  const hands=[0,1].map(d=>([15,16,19,20].reduce((s,k)=>s+g(k)[d],0)/4));
  const sh=[(g(11)[0]+g(12)[0])/2,(g(11)[1]+g(12)[1])/2];
  const hip=[(g(23)[0]+g(24)[0])/2,(g(23)[1]+g(24)[1])/2];
  return {hands,sh,hip,ls:g(11),rs:g(12),nose:g(0),ank:[(g(27)[0]+g(28)[0])/2,(g(27)[1]+g(28)[1])/2],joints:[[...g(11),28],[...g(12),28],[...g(15),20],[...g(16),20]],
    world:r.worldLandmarks&&r.worldLandmarks[0]? r.worldLandmarks[0].map(p=>[p.x,p.y,p.z]) : null};
}
// ---------- progress ----------
function prog(t,f){ $("prog").style.display="block"; $("pt").textContent=t; $("bar").firstElementChild.style.width=Math.round((f||0)*100)+"%"; }
const tick=()=>new Promise(r=>setTimeout(r,0));

// ---------- analysis ----------
// 폰이 보낸 측정값(뼈대 좌표·헤드 후보)을 분석 입력 형태로. 형식이 맞지 않으면 null → 이 기기에서 직접 분석
function fromDet(d){
  if(!d||d.v!==1||!(d.n>30)||!(d.fps>10)||!Array.isArray(d.pose)||!Array.isArray(d.pts)||!(d.ci>=0)) return null;
  if(!((d.W===540&&d.H===960)||(d.W===960&&d.H===540))) return null;
  setFrame(d.W>d.H); const n=d.n|0, pose=new Array(n).fill(null), pts2=new Array(n).fill(null);
  for(const q of d.pose){ const i=q[0]|0; if(i<0||i>=n||q.length<23) continue; const g=k=>[q[1+2*k],q[2+2*k]];
    const m=(a,b)=>[(g(a)[0]+g(b)[0])/2,(g(a)[1]+g(b)[1])/2];   // 순서: 코, 어깨L/R, 손목L/R, 검지L/R, 골반L/R, 발목L/R
    let world=null; if(q.length>=35&&q.slice(23,35).every(v=>typeof v==="number")){ world=[]; [11,12,23,24].forEach((k,j)=>{ world[k]=[q[23+3*j],q[24+3*j],q[25+3*j]]; }); }
    pose[i]={hands:[0,1].map(c=>(g(3)[c]+g(4)[c]+g(5)[c]+g(6)[c])/4),sh:m(1,2),hip:m(7,8),ls:g(1),rs:g(2),nose:g(0),ank:m(9,10),
      joints:[[...g(1),28],[...g(2),28],[...g(3),20],[...g(4),20]],world}; }
  for(const q of d.pts){ const i=q[0]|0; if(i<0||i>=n) continue; const c=[]; for(let k=1;k+2<q.length;k+=3) c.push([q[k],q[k+1],q[k+2]]); pts2[i]=c; }
  const grip=new Array(n).fill(null); if(Array.isArray(d.grip)) for(const q of d.grip){ const i=q[0]|0; if(i>=0&&i<n&&q.length>=4) grip[i]=[q[1],q[2],q[3]]; }
  const eng=String(d.eng||"").split("/");
  return {n,fps:+d.fps,ci:d.ci|0,pts2,pose,grip,crop:Array.isArray(d.crop)?{x:d.crop[0],y:d.crop[1],s:d.crop[2]}:null,ep:"폰 "+(eng[0]||"?"),pd:eng[1]||"?",t0:+d.t0||0,secs:+d.secs||0,ms:Array.isArray(d.ms)?d.ms:null,phone:true};
}
async function analyze(file,det){
  $("pick").disabled=true; const T0=performance.now();
  let D=null; if(det){ try{ D=fromDet(det); }catch(e){ console.warn("det",e); } if(D) prog("폰에서 분석한 값으로 진단 중…",0.6); }
  if(D){ if(det.thumb) showThumb(det.thumb);
    try{ window.__D=D; finish(D,file,T0); return; }
    catch(e){ console.warn("phone det",e); phoneErr=String(e.message||e); prog("폰 측정값으로는 스윙을 찾지 못해 아이패드가 다시 분석합니다…",0.02); await tick(); } }
  if(typeof inFrame!=="undefined"&&inFrame){ parent.postMessage({t:"hs-nav",key:QS.get("clip")||"last"},location.origin); throw new Error("아이패드에서 직접 분석하기 위해 화면을 옮깁니다…"); }   // 직접 분석은 무거워서 겹쳐 띄운 채로 하지 않음
  D=await detect(file);
  window.__D=D;
  try{ finish(D,file,T0); }catch(e){ if(phoneErr) e.message+=" (폰 분석·아이패드 분석 모두 같은 결과)"; throw e; }
}
let phoneErr="";
// 폰이 실제로 분석한 화면 1장(방향·밝기 확인용)
function showThumb(b64){ let im=$("pth"); if(!im){ im=document.createElement("img"); im.id="pth"; im.style.cssText="display:block;max-height:38vh;max-width:90%;margin:12px auto;border:2px solid #555;border-radius:8px"; const c=document.createElement("div"); c.className="dimt"; c.style.textAlign="center"; c.textContent="↑ 폰이 분석한 화면"; $("prog").after(im,c); }
  im.src="data:image/jpeg;base64,"+b64; }
async function detect(file){
  prog("모델 준비 중…",0.02);
  const ep=await loadHead("../");   // one at a time: iPad Safari runs out of memory loading both at once
  prog("뼈대 모델 준비 중…",0.04);
  const pd=await loadPose();
  prog("영상 읽는 중…",0.05);
  const dm=await demux(await file.arrayBuffer()); const n=dm.samples.length, fps=dm.fps; vfps=fps;
  { const r=((dm.rot%360)+360)%360, dw=(r===90||r===270)?dm.ch:dm.cw, dh=(r===90||r===270)?dm.cw:dm.ch; setFrame(dw>dh); }
  if(fps<100) prog("※ "+Math.round(fps)+"fps 영상입니다. 240fps 원본이 가장 정확합니다.",0.06);
  // pass 1: every 8th frame (30fps), pose only (fast, GPU) -> where is the swing. Head model only if the pose can't find it.
  const pts=new Array(n).fill(null), pose1=new Array(n).fill(null); let done=0; const n1=Math.ceil(n/8);
  await decodeRange(dm,0,n-1,async(i,cv)=>{ try{ pose1[i]=poseOf(lmk.detectForVideo(cv,Math.round(i*1000/fps))); }catch(e){}
    done++; if(done%5===0){ prog("1/2 스윙 위치 찾는 중… "+Math.round(done/n1*100)+"%",0.06+0.14*done/n1); await tick(); } },dm.rot,i=>i%8===0);
  let ci=A.handsImpact(pose1.map(p=>p&&p.hands),fps), T2=Math.round(n*1000/fps)+5000;
  if(ci<0){ done=0;
    await decodeRange(dm,0,n-1,async(i,cv)=>{ pts[i]=await headInfer(cv); done++; if(done%5===0){ prog("1/2 스윙 위치 찾는 중(헤드)… "+Math.round(done/n1*100)+"%",0.1+0.1*done/n1); await tick(); } },dm.rot,i=>i%8===0);
    ci=A.coarseImpact(A.fillGaps(A.clean(A.track(A.staticFilter(pts.map(p=>p||[])),160),8,200),8),fps); }
  if(ci<0) throw new Error("스윙(빠른 다운스윙)을 찾지 못했습니다. 골퍼 전신과 스윙 전체가 담긴 영상인지 확인해 주세요.");
  // square crop around the golfer for the head model (smaller input = faster, same pixel scale)
  let crop=null; { const ps=[]; for(let i=Math.max(0,ci-Math.round(2.5*fps));i<=Math.min(n-1,ci+Math.round(0.5*fps));i++) if(pose1[i]&&pose1[i].ank) ps.push(pose1[i]);
    if(ps.length>=4){ const med=f=>{ const v=ps.map(f).sort((x,y)=>x-y); return v[v.length>>1]; };
      const gh=Math.max(60,med(p=>p.ank[1]-p.nose[1])), cx=med(p=>p.hip[0]), cy=med(p=>p.hip[1])-0.12*gh, S=Math.max(380,Math.min(Math.max(W,H),2.25*gh));
      const cl=(v,dim)=>S<=dim? Math.max(0,Math.min(dim-S,v)) : (dim-S)/2;   // keep the crop inside the frame (or centred if larger)
      crop={x:cl(cx-S/2,W),y:cl(cy-S/2,H),s:S}; } }
  const TOFF=2*T2;   // pose timestamps must keep increasing in pass 2
  // pass 2: dense around the downswing, sparse elsewhere
  const a=Math.max(0,ci-Math.round(2.8*fps)), b=Math.min(n-1,ci+Math.round(1.3*fps));
  // head model (the slow part): every frame near impact, every 2nd in the early downswing, every 6th elsewhere
  const d0=ci-Math.round(0.45*fps), dm0=ci-Math.round(0.15*fps), d1=ci+Math.round(0.15*fps), dense=i=>i>=d0&&i<=d1;
  const needH=i=>(i>=dm0&&i<=d1)||(i>=d0&&i<dm0&&(i-a)%2===0)||(i-a)%6===0, needP=i=>(dense(i)&&(i-a)%3===0)||(i-a)%6===0;
  let tot=0; for(let i=a;i<=b;i++) if(needH(i)||needP(i)) tot++;
  const pts2=new Array(n).fill(null), pose=new Array(n).fill(null), grip=new Array(n).fill(null); done=0;
  await decodeRange(dm,a,b,async(i,cv)=>{
    if(needH(i)){ pts2[i]=await headInfer(cv,crop); if(pts2[i].grip) grip[i]=pts2[i].grip; }
    if(needP(i)){ try{ pose[i]=poseOf(lmk.detectForVideo(cv,TOFF+Math.round(i*1000/fps))); }catch(e){} }
    done++; if(done%8===0){ prog("2/2 궤적·뼈대 분석 중… "+Math.round(done/tot*100)+"%",0.2+0.78*done/tot); await tick(); } },dm.rot,i=>needH(i)||needP(i));
  return {n,fps,ci,pts2,pose,grip,crop,ep,pd,t0:dm.samples.map(s=>s.cts/dm.timescale).sort((x,y)=>x-y)[0]};
}
// 측정값 → 궤적·구간·진단 (폰에서 온 값이든 이 기기에서 뽑은 값이든 같은 규칙)
function finish(D,file,T0){
  const {n,fps,ci,pts2,pose,crop,ep,pd}=D; vfps=fps;
  const a=Math.max(0,ci-Math.round(2.8*fps)), b=Math.min(n-1,ci+Math.round(1.3*fps));
  for(let i=a+1;i<=b;i++) if(!pose[i]) pose[i]=pose[i-1];
  // 손 위치: 그립을 직접 찾은 값이 있으면 뼈대의 손목 추정 대신 그것을 쓴다(최근 6프레임 이내, 뼈대 손과 몸통 길이의 0.6배 이상 떨어지면 믿지 않음)
  let nGrip=0; if(D.grip){ let g=null, gi=-99; for(let i=a;i<=b;i++){ if(D.grip[i]){ g=D.grip[i]; gi=i; } const P=pose[i]; if(!P||!g||i-gi>6) continue;
      const tl=Math.hypot(P.sh[0]-P.hip[0],P.sh[1]-P.hip[1]); if(Math.hypot(g[1]-P.hands[0],g[2]-P.hands[1])>0.6*tl) continue;

// 분석 영상: 화면에 보이는 그대로(영상 + 잔상·선·구간 이름)를 1/8 느린 재생으로 녹화해 새 영상으로 만든다. 만드는 데 재생 시간만큼(20~30초) 걸린다.
let recOut=null, recBusy=false;
$("savea").onclick=async()=>{ const b=$("savea"); if(recBusy||!R) return;
  if(recOut){ try{ b.textContent=await saveBlob(recOut.blob,recOut.name); }catch(e){ if(e&&e.name==="AbortError") return; b.textContent="저장 실패"; console.warn(e); } setTimeout(()=>{ b.textContent=recOut?"분석 영상 저장하기":"분석 영상 만들기"; },2500); return; }
  if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){ b.textContent="이 브라우저는 지원 안 함"; return; }
  recBusy=true;
  try{ const cw=720, ch=Math.round(720*H/W/2)*2, rc=document.createElement("canvas"); rc.width=cw; rc.height=ch; const rx=rc.getContext("2d");
    const mt=["video/mp4;codecs=avc1.42E01E","video/mp4","video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"].find(t=>MediaRecorder.isTypeSupported(t))||"";
    const mr=new MediaRecorder(rc.captureStream(30),mt?{mimeType:mt,videoBitsPerSecond:6e6}:{}), chunks=[]; mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    const a=Math.max(0,R.ph.start-Math.round(0.3*R.fps)), z=R.ph.fin;
    const paint=()=>{ draw(); const r=vrect(), dpr=devicePixelRatio||1; rx.drawImage(vid,0,0,cw,ch); rx.drawImage(ov,r.x*dpr,r.y*dpr,r.w*dpr,r.h*dpr,0,0,cw,ch);
      const t=$("phase").textContent; rx.font="700 30px sans-serif"; rx.fillStyle="rgba(0,0,0,.55)"; rx.fillRect(10,10,rx.measureText(t).width+24,46); rx.fillStyle="#fff"; rx.fillText(t,22,44); };
    seekFrame(a); await new Promise(r=>{ vid.addEventListener("seeked",r,{once:true}); setTimeout(r,2500); }); paint(); mr.start(500);
    vid.playbackRate=0.125; await vid.play();
    await new Promise(res=>{ const t0=performance.now(), tick=()=>{ paint(); const i=frameAt(vid.currentTime); b.textContent="만드는 중… "+Math.max(0,Math.min(99,Math.round((i-a)/Math.max(1,z-a)*100)))+"%";
        if(vid.paused||vid.ended||i>=z||performance.now()-t0>90000){ res(); return; } requestAnimationFrame(tick); }; tick(); });
    vid.pause(); paint(); await new Promise(r=>setTimeout(r,400)); await new Promise(r=>{ mr.onstop=r; mr.stop(); });
    const type=(mt||mr.mimeType||"video/webm").split(";")[0]; if(!chunks.length) throw new Error("empty");
    recOut={blob:new Blob(chunks,{type}),name:"swing-analysis-"+stamp()+(type.includes("mp4")?".mp4":".webm")}; b.textContent="분석 영상 저장하기";
  }catch(e){ console.warn(e); b.textContent="만들기 실패"; setTimeout(()=>{ b.textContent="분석 영상 만들기"; },2500); }
  finally{ recBusy=false; $("play").textContent="▶ 1/8 느리게"; } };
async function run(f,det){
  try{ await analyze(f,det); curFile=f; recOut=null; $("savea").textContent="분석 영상 만들기";
    vid.src=URL.createObjectURL(f); await new Promise(r=>vid.addEventListener("loadedmetadata",r,{once:true}));
    $("start").hidden=true; $("ctl").hidden=false; $("phase").hidden=false; $("legend").hidden=false;
    await loadRef(); results(true); setCmp(true); seekFrame(R.ph.imp); captureGhosts();
  }catch(e){ console.error(e); prog("오류: "+(e.message||e),0); $("pick").disabled=false; }
}
$("file").onchange=()=>{ const f=$("file").files[0]; if(f) run(f); };
const ck=new URLSearchParams(location.search).get("clip");
if(ck) idbGet(ck).then(v=>{ if(v&&v.blob){ prog("폰에서 받은 영상: "+(v.name||"")+" 분석 시작",0.01); if(v.name&&!v.blob.name){ try{ v.blob.name=v.name; }catch(e){} } run(v.blob,v.det); } else prog("받은 영상이 없습니다. '영상 불러오기'를 눌러 주세요.",0); }).catch(e=>prog("저장된 영상을 읽지 못했습니다: "+e,0));
window.__R=()=>R; window.__run=run;
window.__show=async(r,url)=>{ R=r; vid.src=url; await new Promise(q=>vid.addEventListener("loadedmetadata",q,{once:true})); $("start").hidden=true; $("ctl").hidden=false; $("phase").hidden=false; $("legend").hidden=false; results(); seekFrame(R.ph.imp); captureGhosts(); };

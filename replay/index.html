</style></head><body>
<div id="app">
  <div id="left">

      <div id="legend" hidden><span style="color:var(--back)">━ 백스윙</span> <span style="color:var(--down)">━ 다운스윙</span> <span style="color:var(--after)">━ 팔로스루</span><br><span style="color:var(--shaft)">━ 샤프트선</span> <span style="color:var(--shoulder)">━ 어깨선</span> · 점선=가려져 추정</div>

<input type="file" id="file" accept="video/*">
<script src="../vendor/ort/ort.webgpu.min.js"></script>
<script src="../vendor/mp4box/mp4box.all.min.js"></script>
<script type="module">
import {W,H,setFrame,loadHead,headInfer,demux,decodeRange} from "./engine.js";
import * as A from "./analysis.js";
import {diagnose,summary} from "./diagnose.js";
const $=id=>document.getElementById(id);
let R=null, showLines=true, vfps=240;

// ---------- pose (MediaPipe tasks, same files as the live page) ----------
let lmk=null;
async function loadPose(){
  const MPV=await import("../vendor/tasks/vision_bundle.mjs");
  const vision=await MPV.FilesetResolver.forVisionTasks(new URL("../vendor/tasks/wasm",location.href).href);
  const fp=new URLSearchParams(location.search).get("pd");
  for(const delegate of (fp?[fp]:["GPU","CPU"])){
    try{ lmk=await MPV.PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:new URL("../vendor/models/pose_landmarker_heavy.task",location.href).href,delegate},runningMode:"VIDEO",numPoses:1}); return delegate; }
    catch(e){ console.warn("pose",delegate,e); }
  }
  throw new Error("뼈대 모델을 불러오지 못했습니다");
}
function poseOf(r){
  if(!r||!r.landmarks||!r.landmarks.length) return null;
  const L=r.landmarks[0], g=k=>[L[k].x*W,L[k].y*H];
  const hands=[0,1].map(d=>([15,16,19,20].reduce((s,k)=>s+g(k)[d],0)/4));
  const sh=[(g(11)[0]+g(12)[0])/2,(g(11)[1]+g(12)[1])/2];
  const hip=[(g(23)[0]+g(24)[0])/2,(g(23)[1]+g(24)[1])/2];
  return {hands,sh,hip,ls:g(11),rs:g(12),nose:g(0),ank:[(g(27)[0]+g(28)[0])/2,(g(27)[1]+g(28)[1])/2],joints:[[...g(11),28],[...g(12),28],[...g(15),20],[...g(16),20]],
    world:r.worldLandmarks&&r.worldLandmarks[0]? r.worldLandmarks[0].map(p=>[p.x,p.y,p.z]) : null};
}
// ---------- progress ----------
function prog(t,f){ $("prog").style.display="block"; $("pt").textContent=t; $("bar").firstElementChild.style.width=Math.round((f||0)*100)+"%"; }
const tick=()=>new Promise(r=>setTimeout(r,0));

// ---------- analysis ----------
// 폰이 보낸 측정값(뼈대 좌표·헤드 후보)을 분석 입력 형태로. 형식이 맞지 않으면 null → 이 기기에서 직접 분석
function fromDet(d){
  if(!d||d.v!==1||!(d.n>30)||!(d.fps>10)||!Array.isArray(d.pose)||!Array.isArray(d.pts)||!(d.ci>=0)) return null;
  if(!((d.W===540&&d.H===960)||(d.W===960&&d.H===540))) return null;
  setFrame(d.W>d.H); const n=d.n|0, pose=new Array(n).fill(null), pts2=new Array(n).fill(null);
  for(const q of d.pose){ const i=q[0]|0; if(i<0||i>=n||q.length<23) continue; const g=k=>[q[1+2*k],q[2+2*k]];
    const m=(a,b)=>[(g(a)[0]+g(b)[0])/2,(g(a)[1]+g(b)[1])/2];   // 순서: 코, 어깨L/R, 손목L/R, 검지L/R, 골반L/R, 발목L/R
    let world=null; if(q.length>=35&&q.slice(23,35).every(v=>typeof v==="number")){ world=[]; [11,12,23,24].forEach((k,j)=>{ world[k]=[q[23+3*j],q[24+3*j],q[25+3*j]]; }); }
    pose[i]={hands:[0,1].map(c=>(g(3)[c]+g(4)[c]+g(5)[c]+g(6)[c])/4),sh:m(1,2),hip:m(7,8),ls:g(1),rs:g(2),nose:g(0),ank:m(9,10),
      joints:[[...g(1),28],[...g(2),28],[...g(3),20],[...g(4),20]],world}; }
  for(const q of d.pts){ const i=q[0]|0; if(i<0||i>=n) continue; const c=[]; for(let k=1;k+2<q.length;k+=3) c.push([q[k],q[k+1],q[k+2]]); pts2[i]=c; }
  const eng=String(d.eng||"").split("/");
  return {n,fps:+d.fps,ci:d.ci|0,pts2,pose,crop:Array.isArray(d.crop)?{x:d.crop[0],y:d.crop[1],s:d.crop[2]}:null,ep:"폰 "+(eng[0]||"?"),pd:eng[1]||"?",t0:+d.t0||0,secs:+d.secs||0,phone:true};
}
async function analyze(file,det){
  $("pick").disabled=true; const T0=performance.now();
  let D=null; if(det){ try{ D=fromDet(det); }catch(e){ console.warn("det",e); } if(D) prog("폰에서 분석한 값으로 진단 중…",0.6); }
  if(!D) D=await detect(file);
  window.__D=D; finish(D,file,T0);
}
async function detect(file){
  prog("모델 준비 중…",0.02);
  const ep=await loadHead("../");   // one at a time: iPad Safari runs out of memory loading both at once
  prog("뼈대 모델 준비 중…",0.04);
  const pd=await loadPose();
  prog("영상 읽는 중…",0.05);
  const dm=await demux(await file.arrayBuffer()); const n=dm.samples.length, fps=dm.fps; vfps=fps;
  { const r=((dm.rot%360)+360)%360, dw=(r===90||r===270)?dm.ch:dm.cw, dh=(r===90||r===270)?dm.cw:dm.ch; setFrame(dw>dh); }
  if(fps<100) prog("※ "+Math.round(fps)+"fps 영상입니다. 240fps 원본이 가장 정확합니다.",0.06);
  // pass 1: every 8th frame (30fps), pose only (fast, GPU) -> where is the swing. Head model only if the pose can't find it.
  const pts=new Array(n).fill(null), pose1=new Array(n).fill(null); let done=0; const n1=Math.ceil(n/8);
  await decodeRange(dm,0,n-1,async(i,cv)=>{ try{ pose1[i]=poseOf(lmk.detectForVideo(cv,Math.round(i*1000/fps))); }catch(e){}
    done++; if(done%5===0){ prog("1/2 스윙 위치 찾는 중… "+Math.round(done/n1*100)+"%",0.06+0.14*done/n1); await tick(); } },dm.rot,i=>i%8===0);
  let ci=A.handsImpact(pose1.map(p=>p&&p.hands),fps), T2=Math.round(n*1000/fps)+5000;
  if(ci<0){ done=0;
    await decodeRange(dm,0,n-1,async(i,cv)=>{ pts[i]=await headInfer(cv); done++; if(done%5===0){ prog("1/2 스윙 위치 찾는 중(헤드)… "+Math.round(done/n1*100)+"%",0.1+0.1*done/n1); await tick(); } },dm.rot,i=>i%8===0);
    ci=A.coarseImpact(A.fillGaps(A.clean(A.track(A.staticFilter(pts.map(p=>p||[])),160),8,200),8),fps); }
  if(ci<0) throw new Error("스윙(빠른 다운스윙)을 찾지 못했습니다. 골퍼 전신과 스윙 전체가 담긴 영상인지 확인해 주세요.");
  // square crop around the golfer for the head model (smaller input = faster, same pixel scale)
  let crop=null; { const ps=[]; for(let i=Math.max(0,ci-Math.round(2.5*fps));i<=Math.min(n-1,ci+Math.round(0.5*fps));i++) if(pose1[i]&&pose1[i].ank) ps.push(pose1[i]);
    if(ps.length>=4){ const med=f=>{ const v=ps.map(f).sort((x,y)=>x-y); return v[v.length>>1]; };
      const gh=Math.max(60,med(p=>p.ank[1]-p.nose[1])), cx=med(p=>p.hip[0]), cy=med(p=>p.hip[1])-0.12*gh, S=Math.max(380,Math.min(Math.max(W,H),2.25*gh));
      const cl=(v,dim)=>S<=dim? Math.max(0,Math.min(dim-S,v)) : (dim-S)/2;   // keep the crop inside the frame (or centred if larger)
      crop={x:cl(cx-S/2,W),y:cl(cy-S/2,H),s:S}; } }
  const TOFF=2*T2;   // pose timestamps must keep increasing in pass 2
  // pass 2: dense around the downswing, sparse elsewhere
  const a=Math.max(0,ci-Math.round(2.8*fps)), b=Math.min(n-1,ci+Math.round(1.3*fps));
  // head model (the slow part): every frame near impact, every 2nd in the early downswing, every 6th elsewhere
  const d0=ci-Math.round(0.45*fps), dm0=ci-Math.round(0.15*fps), d1=ci+Math.round(0.15*fps), dense=i=>i>=d0&&i<=d1;
  const needH=i=>(i>=dm0&&i<=d1)||(i>=d0&&i<dm0&&(i-a)%2===0)||(i-a)%6===0, needP=i=>(dense(i)&&(i-a)%3===0)||(i-a)%6===0;
  let tot=0; for(let i=a;i<=b;i++) if(needH(i)||needP(i)) tot++;
  const pts2=new Array(n).fill(null), pose=new Array(n).fill(null); done=0;
  await decodeRange(dm,a,b,async(i,cv)=>{
    if(needH(i)) pts2[i]=await headInfer(cv,crop);
    if(needP(i)){ try{ pose[i]=poseOf(lmk.detectForVideo(cv,TOFF+Math.round(i*1000/fps))); }catch(e){} }
    done++; if(done%8===0){ prog("2/2 궤적·뼈대 분석 중… "+Math.round(done/tot*100)+"%",0.2+0.78*done/tot); await tick(); } },dm.rot,i=>needH(i)||needP(i));
  return {n,fps,ci,pts2,pose,crop,ep,pd,t0:dm.samples.map(s=>s.cts/dm.timescale).sort((x,y)=>x-y)[0]};
}
// 측정값 → 궤적·구간·진단 (폰에서 온 값이든 이 기기에서 뽑은 값이든 같은 규칙)
function finish(D,file,T0){
  const {n,fps,ci,pts2,pose,crop,ep,pd}=D; vfps=fps;
  const a=Math.max(0,ci-Math.round(2.8*fps)), b=Math.min(n-1,ci+Math.round(1.3*fps));
  for(let i=a+1;i<=b;i++) if(!pose[i]) pose[i]=pose[i-1];
  let tr=A.fillGaps(A.clean(A.track(A.bodyFilter(A.staticFilter(pts2.map(p=>p||[])),pose),110),6,110),6);
  tr=A.clubLengthFilter(tr,pose.map(p=>p&&p.hands)).tr;
  const phP=A.posePhases(pose,fps,ci);
  const vw=phP? A.viewOf(pose,tr,phP.start-Math.round(0.3*fps),phP.start) : null; const view=vw?vw.view:"dtl";
  let ph=view==="dtl"? A.phases(tr,fps,pose.map(p=>p&&p.hands)) : null;
  if(!ph||ph.top<0||ph.imp-ph.top<0.15*fps||(phP&&Math.abs(ph.imp-phP.imp)>0.12*fps)) ph=phP||ph;
  if(!ph) throw new Error("스윙 구간을 판정하지 못했습니다.");
  { const seenD=tr.slice(ph.top,ph.imp+1).filter(Boolean).length, nP=pose.slice(ph.start,ph.imp+1).filter(Boolean).length;
    const P0=pose[ph.start]||pose.find(Boolean);
    const rise=P0&&pose[ph.top]? P0.hands[1]-pose[ph.top].hands[1] : 0, tl=P0? Math.hypot(P0.sh[0]-P0.hip[0],P0.sh[1]-P0.hip[1]) : 1;
    if(nP<5||rise<0.6*tl) throw new Error("이 영상에서는 골퍼의 스윙을 찾지 못했습니다(손이 어깨 위로 올라가는 동작이 없음). 옆 타석 소리로 저장된 영상일 수 있습니다. 골퍼가 화면 가운데에 전신이 보이게 찍힌 영상을 골라 주세요."); }
  const cv=A.curves(tr,ph,fps), pl=view==="dtl"? A.plane(tr,ph,pose,fps) : null, bd=A.body(pose,ph), fo=view!=="dtl"? A.faceOn(pose,ph,tr) : null;
  const seen=tr.slice(ph.start,ph.imp+1).filter(Boolean).length, span=ph.imp-ph.start+1;
  const po=A.posture(pose,ph,fps,view);
  R={crop,secs:D.phone?D.secs:(performance.now()-T0)/1000,phone:!!D.phone,name:file.name||'',view,vw,fo,po,fps,n,ph,tr,cv,pl,bd,ep,pd,seen,span,t0:D.t0};
  prog("완료",1);
}
// ---------- results panel ----------
function fmt(x,d=0){ return (x>=0?"":"−")+Math.abs(x).toFixed(d); }
function detailHtml(){
  const {ph,fps,pl,bd,seen,span}=R, back=(ph.top-ph.start)/fps, down=(ph.imp-ph.top)/fps;
  const zoneTxt={over:["어깨선 위(바깥)","bad","아웃-인(엎어 치기) 경향"],slot:["두 선 사이","ok","정상 범위"],under:["샤프트선 아래(안쪽)","warn","인-아웃 경향"]};
  let h=`<div class="card"><h3>템포</h3><div class="big">${(back/down).toFixed(1)} : 1</div>
    <div class="row"><span>백스윙</span><b>${back.toFixed(2)}초</b></div><div class="row"><span>다운스윙</span><b>${down.toFixed(2)}초</b></div>
    <div class="dimt">프로 평균은 약 3 : 1 (백스윙 0.7~0.9초)</div></div>`;
  if(pl){
    const fz=pl.finalZone&&zoneTxt[pl.finalZone];
    h+=`<div class="card"><h3>스윙 플레인 (뒤에서 본 2D 기준)</h3>
      ${fz?`<div class="big ${fz[1]}">${fz[2]}</div><div class="row"><span>임팩트 진입</span><b class="${fz[1]}">${fz[0]}</b></div>`:`<div class="big warn">판정 보류</div><div class="dimt">다운스윙 하단에서 헤드가 보인 장면이 ${pl.nDown}개뿐이라 판정하지 않습니다(6개 이상 필요). 골퍼를 화면에 더 크게, 밝게 찍으면 나아집니다.</div>`}
      <div class="row"><span>테이크백</span><b class="${pl.takeawayOver>0.5?'warn':'ok'}">${pl.takeawayOver>0.5?'어깨선 바깥으로 들어 올림':'두 선 사이'}</b></div>
      ${pl.nDown>=6?`<div class="row"><span>다운스윙</span><b>${["slot","under","over"].map(z=>({slot:"사이",under:"아래",over:"위"})[z]+" "+Math.round(({slot:pl.downSlot,under:pl.downUnder,over:pl.downOver})[z]*100)+"%").join(" · ")}</b></div>`:""}
      <div class="dimt">초록=어드레스 샤프트선, 주황=공-어깨선. 다운스윙이 두 선 사이로 오면 정상.</div></div>`;
  } else if(R.view!=="dtl"){
    const f=R.fo, c=v=>v==null?"<span class='warn'>측정 안 됨</span>":Math.abs(v)>30?"<span class='warn'>측정 이상</span>":(Math.abs(v)<1?"0":Math.abs(v).toFixed(0))+"cm "+(Math.abs(v)<1?"":v>0?"뒤로":"타깃 쪽");
    const tone=(v,lim)=>v==null?"":Math.abs(v)>lim?"warn":"ok";
    h+=`<div class="card"><h3>정면 분석 (어드레스 대비 좌우 이동)</h3>
      ${f?`<div class="row"><span>탑 · 머리</span><b class="${tone(f.headTop,5)}">${c(f.headTop)}</b></div>
      <div class="row"><span>탑 · 골반</span><b class="${tone(f.hipTop,6)}">${c(f.hipTop)}</b></div>
      <div class="row"><span>임팩트 · 머리</span><b class="${tone(f.headImp,5)}">${c(f.headImp)}</b></div>
      <div class="row"><span>임팩트 · 골반</span><b class="${tone(-f.hipImp,0)}">${c(f.hipImp)}</b></div>
      <div class="row"><span>임팩트 샤프트 기울기</span><b>${f.lean==null?"<span class='warn'>측정 안 됨</span>":(f.lean>=0?"손이 앞 ":"헤드가 앞 ")+Math.abs(f.lean).toFixed(0)+"°"}</b></div>
      <div class="dimt">참고: 머리는 탑·임팩트 모두 5cm 이내가 좋고, 골반은 임팩트 때 타깃 쪽으로 이동해 있는 게 일반적입니다. 아이언은 임팩트 때 손이 헤드보다 앞(핸드 퍼스트). 어깨너비를 약 40cm로 보고 환산한 대략값입니다.</div>`
      :`<div class="dimt">자세를 찾지 못해 측정하지 못했습니다.</div>`}</div>
      <div class="card"><h3>스윙 플레인</h3><div class="dimt">플레인(인-아웃) 판정은 뒤에서(타깃 방향 뒤) 찍은 영상에서만 합니다.</div></div>`;
  } else h+=`<div class="card"><h3>스윙 플레인</h3><div class="dimt">어드레스 자세(손·어깨)를 찾지 못해 판정하지 않았습니다.</div></div>`;
  if(bd&&bd.top){
    const v=(o,k)=>o&&o.ok? Math.abs(o[k]).toFixed(0)+"°" : "<span class='warn'>측정 이상</span>";
    const sg=bd.top&&bd.top.ok? Math.sign(bd.top.chest)||-1 : -1;   // backswing direction
    const oc=(o,k)=>o&&o.ok? (o[k]*sg>0? Math.abs(o[k]).toFixed(0)+"° 덜 돌아옴(닫힘)" : Math.abs(o[k]).toFixed(0)+"° 열림") : "<span class='warn'>측정 이상</span>";
    h+=`<div class="card"><h3>몸 회전 (어드레스 대비)</h3>
      <div class="row"><span>탑 · 가슴</span><b>${v(bd.top,"chest")}</b></div><div class="row"><span>탑 · 골반</span><b>${v(bd.top,"pelvis")}</b></div>
      <div class="row"><span>탑 · X-팩터</span><b>${bd.top.ok?Math.abs(bd.top.x).toFixed(0)+"°":"<span class='warn'>측정 이상</span>"}</b></div>
      <div class="row"><span>임팩트 · 가슴</span><b>${oc(bd.imp,"chest")}</b></div><div class="row"><span>임팩트 · 골반</span><b>${oc(bd.imp,"pelvis")}</b></div>
      <div class="dimt">투어 평균(참고): 탑 가슴 약 90°·골반 약 45°, 임팩트 때는 골반 약 40°·가슴 약 25° 타깃 쪽으로 열림. 카메라 1대 추정값이라 오차가 큽니다(특히 뒤에서 찍을 때).</div></div>`;
  }
  h+=`<div class="card"><h3>측정 품질</h3><div class="row"><span>헤드 실측</span><b>${Math.round(seen/span*100)}%</b></div>
    <div class="row"><span>영상</span><b>${Math.round(fps)}fps · ${({face:"정면",dtl:"후면",angle:"비스듬"})[R.view]||"-"}</b></div><div class="row"><span>분석 시간</span><b>${R.phone?"폰에서 ":""}${Math.round(R.secs||0)}초</b></div>
    <div class="dimt">${R.name?R.name+" · ":""}엔진 ${R.ep}/${R.pd} · 분석기 v64</div></div>`;
  return h;
}
const HK="swinghist";
function hist(){ try{ return JSON.parse(localStorage.getItem(HK)||"[]"); }catch(e){ return []; } }
function saveHist(rec){ try{ const a=hist().filter(x=>!(x.name&&x.name===rec.name&&Math.abs((x.down||0)-(rec.down||0))<0.005)); a.push(rec); localStorage.setItem(HK,JSON.stringify(a.slice(-200))); }catch(e){} }
function histHtml(){
  const a=hist().filter(x=>x.view===R.view).slice(-8); if(a.length<2) return `<div class="dimt">스윙을 2개 이상 분석하면 여기에서 비교됩니다. (이 기기에 저장)</div>`;
  const z={over:"아웃-인",under:"인-아웃",slot:"정상"}, c=(v,d=2,u="")=>v==null?"-":v.toFixed(d)+u;
  const rows=[["탑 멈춤(초)",x=>c(x.hold)],["백스윙(초)",x=>c(x.back)],["다운(초)",x=>c(x.down)],["진입 궤도",x=>x.entry?z[x.entry]:"-"],["가슴°",x=>c(x.chest,0)],["골반°",x=>c(x.pelvis,0)],["엉덩이 전진%",x=>c(x.ee,0)],["머리 들림%",x=>c(x.headUp,0)]];
  return `<div class="tw"><table><tr><th></th>${a.map((x,i)=>`<th>${i===a.length-1?"이번":"-"+(a.length-1-i)}</th>`).join("")}</tr>`+
    rows.map(([n,f])=>`<tr><td>${n}</td>${a.map(x=>`<td>${f(x)}</td>`).join("")}</tr>`).join("")+`</table></div><div class="dimt">최근 ${a.length}개(같은 카메라 방향). 오른쪽이 이번 스윙.</div>`;
}
function results(save){
  const D=diagnose(R); R.D=D; if(save) saveHist(summary(R,D));
  const card=x=>`<div class="dx ${x.sev}"><div class="dt">${x.title}</div>
    <div class="row"><span>측정</span><b class="${x.sev==="na"?"warn":x.sev}">${x.value}</b></div>${x.ref?`<div class="row"><span>기준</span><b>${x.ref}</b></div>`:""}
    <div class="dimt">${x.why}</div>${x.drill&&x.sev!=="ok"?`<div class="drill"><b>연습</b> ${x.drill}</div>`:""}
    <div class="dimt">${x.area} · 신뢰도 ${x.conf}</div></div>`;
  const na=D.items.filter(x=>x.sev==="na");
  let h=`<div class="sum ${D.issues.some(x=>x.sev==="bad")?"bad":D.issues.length?"warn":"ok"}">${D.issues.length?`고칠 점 <b>${D.issues.length}</b>가지 · 양호 ${D.good.length}가지`:`뚜렷한 문제 없음 · 양호 ${D.good.length}가지`}</div>`;
  if(D.issues.length){ h+=`<h2>먼저 고칠 것</h2>`+D.issues.slice(0,3).map(card).join("");
    if(D.issues.length>3) h+=`<details><summary>나머지 ${D.issues.length-3}가지</summary>${D.issues.slice(3).map(card).join("")}</details>`; }
  if(na.length) h+=na.map(card).join("");
  h+=`<details><summary>양호한 항목 ${D.good.length}가지</summary>${D.good.map(card).join("")}</details>`;
  h+=`<h2>스윙 기록 비교</h2><div class="card">${histHtml()}</div>`;
  h+=`<details><summary>상세 수치</summary>${detailHtml()}</details>`;
  h+=`<div class="dimt">기준 범위는 투어·레슨에서 흔히 쓰는 참고값입니다. 신뢰도 '낮음' 항목은 카메라 1대 추정이라 방향만 참고하세요.</div>`;
  $("res").innerHTML=h;
  for(const k of ["p2","p6"]){ const b=document.querySelector(`[data-k="${k}"]`); if(b) b.hidden=!(R.po&&R.po[k]!=null); }
}
// ---------- overlay ----------
const ov=$("ov"), ox=ov.getContext("2d"), vid=$("vid");
function vrect(){ // displayed video content box inside the stage (object-fit: contain)
  const s=$("stage").getBoundingClientRect(), vw=vid.videoWidth||W, vh=vid.videoHeight||H, k=Math.min(s.width/vw,s.height/vh), w=vw*k, h=vh*k;
  return {x:(s.width-w)/2,y:(s.height-h)/2,w,h,sw:s.width,sh:s.height}; }
function frameAt(t){ return Math.max(0,Math.min(R.n-1,Math.floor(t*R.fps+1e-6))); }
function phaseName(i){ const p=R.ph; return i<p.start?"어드레스":i<=p.top?"백스윙":i<=p.imp?"다운스윙":"팔로스루"; }
function draw(){
  if(!R) return; const r=vrect(), dpr=devicePixelRatio||1;
  if(ov.width!==Math.round(r.sw*dpr)){ ov.width=Math.round(r.sw*dpr); ov.height=Math.round(r.sh*dpr); }
  ox.setTransform(dpr,0,0,dpr,0,0); ox.clearRect(0,0,r.sw,r.sh);
  const sx=r.w/W, sy=r.h/H, P=(x,y)=>[r.x+x*sx,r.y+y*sy], i=frameAt(vid.currentTime);
  ox.save(); ox.beginPath(); ox.rect(r.x,r.y,r.w,r.h); ox.clip();
  $("phase").textContent=phaseName(i)+"  "+((i-R.ph.imp)/R.fps>=0?"+":"")+((i-R.ph.imp)/R.fps).toFixed(2)+"초";
  if(showLines&&R.pl){ const {ball,hands,sh}=R.pl;
    const line=(q,c)=>{ const dx=q[0]-ball[0],dy=q[1]-ball[1],l=Math.hypot(dx,dy); ox.strokeStyle=c; ox.lineWidth=3; ox.setLineDash([]); ox.beginPath(); ox.moveTo(...P(ball[0]-dx/l*30,ball[1]-dy/l*30)); ox.lineTo(...P(ball[0]+dx/l*900,ball[1]+dy/l*900)); ox.stroke(); };
    line(hands,"#5be37a"); line(sh,"#ff9f2e"); }
  const seg=(arr,col)=>{ ox.strokeStyle=col; ox.lineWidth=4; ox.lineCap="round"; let prev=null;
    for(const q of arr){ if(!q){prev=null;continue;} if(q.i>i) break;
      if(prev){ ox.setLineDash(q.est||prev.est?[7,7]:[]); ox.beginPath(); ox.moveTo(...P(prev.x,prev.y)); ox.lineTo(...P(q.x,q.y)); ox.stroke(); } prev=q; } ox.setLineDash([]); };
  const cur=i<=R.ph.top?"back":i<=R.ph.imp?"down":"after";   // current phase bright, earlier ones faded so the picture stays readable
  for(const [k,col] of [["back","#ffd23f"],["down","#ff4d4d"],["after","#59c8ff"]]){ ox.globalAlpha=(k===cur||(cur==="after"&&k==="down"))?1:0.3; seg(R.cv[k],col); }
  ox.globalAlpha=1;
  const p=R.tr[i]; if(p){ ox.strokeStyle="#fff"; ox.lineWidth=3; ox.beginPath(); ox.arc(...P(p[0],p[1]),12,0,7); ox.stroke(); }
  ox.restore();
}
function loop(){ draw(); if(!vid.paused) requestAnimationFrame(loop); }
if("requestVideoFrameCallback" in HTMLVideoElement.prototype){ const f=()=>{ draw(); vid.requestVideoFrameCallback(f); }; vid.requestVideoFrameCallback(f); }
vid.addEventListener("seeked",draw); window.addEventListener("resize",draw);
const seekFrame=i=>{ vid.pause(); vid.currentTime=Math.max(0,Math.min(vid.duration-0.001,(i+0.5)/R.fps)); };
$("play").onclick=()=>{ if(vid.paused){ if(frameAt(vid.currentTime)>=R.ph.fin) seekFrame(R.ph.start-Math.round(0.3*R.fps)); vid.playbackRate=0.125; vid.play(); $("play").textContent="⏸ 멈춤"; loop(); } else { vid.pause(); $("play").textContent="▶ 1/8 느리게"; } };
vid.addEventListener("timeupdate",()=>{ if(R&&frameAt(vid.currentTime)>=R.ph.fin&&!vid.paused){ vid.pause(); $("play").textContent="▶ 1/8 느리게"; } });
$("prev").onclick=()=>seekFrame(frameAt(vid.currentTime)-1);
$("next").onclick=()=>seekFrame(frameAt(vid.currentTime)+1);
document.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>seekFrame(R.ph[b.dataset.j]));
document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ const i=R.po&&R.po[b.dataset.k]; if(i!=null) seekFrame(i); });
$("lines").onclick=()=>{ showLines=!showLines; $("lines").classList.toggle("on",showLines); draw(); };
$("again").onclick=()=>{ location.href=location.pathname+(new URLSearchParams(location.search).get("from")?"?from=live":""); };
if(new URLSearchParams(location.search).get("from")==="live"){ $("live").hidden=false; $("live").onclick=()=>{ location.href="../"; };
  const bb=document.createElement("button"); bb.textContent="← 실시간 화면"; bb.style.cssText="position:absolute;left:12px;top:12px;z-index:5;flex:0 0 auto"; bb.onclick=()=>{ location.href="../"; }; $("start").appendChild(bb); }
$("pick").onclick=()=>$("file").click();
function idbGet(key){ return new Promise((res,rej)=>{ const q=indexedDB.open("swingclips",1); q.onupgradeneeded=()=>q.result.createObjectStore("c");
  q.onsuccess=()=>{ const g=q.result.transaction("c").objectStore("c").get(key); g.onsuccess=()=>res(g.result); g.onerror=()=>rej(g.error); }; q.onerror=()=>rej(q.error); }); }
async function run(f,det){
  try{ await analyze(f,det);
    vid.src=URL.createObjectURL(f); await new Promise(r=>vid.addEventListener("loadedmetadata",r,{once:true}));
    $("start").hidden=true; $("ctl").hidden=false; $("phase").hidden=false; $("legend").hidden=false;
    results(true); seekFrame(R.ph.imp);
  }catch(e){ console.error(e); prog("오류: "+(e.message||e),0); $("pick").disabled=false; }
}
$("file").onchange=()=>{ const f=$("file").files[0]; if(f) run(f); };
const ck=new URLSearchParams(location.search).get("clip");
if(ck) idbGet(ck).then(v=>{ if(v&&v.blob){ prog("폰에서 받은 영상: "+(v.name||"")+" 분석 시작",0.01); if(v.name&&!v.blob.name){ try{ v.blob.name=v.name; }catch(e){} } run(v.blob,v.det); } else prog("받은 영상이 없습니다. '영상 불러오기'를 눌러 주세요.",0); }).catch(e=>prog("저장된 영상을 읽지 못했습니다: "+e,0));
window.__R=()=>R; window.__run=run;
window.__show=async(r,url)=>{ R=r; vid.src=url; await new Promise(q=>vid.addEventListener("loadedmetadata",q,{once:true})); $("start").hidden=true; $("ctl").hidden=false; $("phase").hidden=false; $("legend").hidden=false; results(); seekFrame(R.ph.imp); };
</script></body></html>
